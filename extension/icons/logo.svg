<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cadence">
  <defs>
    <linearGradient id="dr-tile" x1="24" y1="12" x2="104" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d6ce0"/>
      <stop offset="1" stop-color="#514fce"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#dr-tile)"/>

  <!-- reading lines: bright where revealed, fading past the frontier -->
  <rect x="32" y="41" width="64" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="32" y="59" width="40" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="32" y="77" width="56" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.34"/>
  <rect x="32" y="95" width="30" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.2"/>

  <!-- reveal caret at the frontier, in the amber highlight accent -->
  <rect x="78" y="54" width="10" height="19" rx="3" fill="#f5b544"/>
</svg>
