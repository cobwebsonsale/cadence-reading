<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadence Reading — Open a document</title>
    <link rel="icon" type="image/svg+xml" href="../icons/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #202124;
        --dim: #5f6368;
        --surface: #f6f7f9;
        --border: #e2e4e8;
        --accent: #5b5bd6;
        --amber: #f5b544;
        --danger: #c5221f;
      }
      :root[data-theme="dark"] {
        --bg: #1b1d21;
        --fg: #e8e8ea;
        --dim: #9aa0a6;
        --surface: #24262b;
        --border: #3a3e46;
        --accent: #9b9ef0;
        --amber: #f5b544;
        --danger: #f28b82;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]):not([data-theme="dark"]) {
          --bg: #1b1d21;
          --fg: #e8e8ea;
          --dim: #9aa0a6;
          --surface: #24262b;
          --border: #3a3e46;
          --accent: #9b9ef0;
          --amber: #f5b544;
          --danger: #f28b82;
        }
      }
      * { box-sizing: border-box; }
      html {
        min-height: 100%;
        background:
          radial-gradient(1100px 600px at 50% -10%, rgba(109, 108, 224, 0.14), transparent 60%),
          var(--bg);
        background-repeat: no-repeat;
        background-attachment: fixed;
      }
      body {
        min-height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { text-align: center; width: 100%; max-width: 460px; padding: 24px; margin: auto; }

      .brand { display: inline-flex; align-items: center; gap: 10px; }
      .brand svg { width: 34px; height: 34px; }
      .wordmark { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
      .wordmark .caret {
        display: inline-block; width: 3px; height: 0.95em; margin: 0 1px;
        vertical-align: -0.12em; background: var(--amber); border-radius: 1px;
        animation: caret-blink 1.1s steps(1, end) infinite;
      }
      .wordmark .pending { margin-left: 3px; opacity: 0.4; font-weight: 550; }
      @keyframes caret-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .wordmark .caret { animation: none; }
        #drop, .drop-icon, .spinner { transition: none; }
      }

      .tagline { color: var(--dim); font-size: 14px; margin: 10px 0 30px; }

      #drop {
        position: relative;
        border: 1.5px dashed var(--border);
        border-radius: 16px;
        background: var(--surface);
        padding: 44px 28px;
        cursor: pointer;
        transition: border-color 140ms ease, background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
      }
      #drop:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
      #drop.over {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, var(--surface));
        transform: translateY(-2px);
        box-shadow: 0 12px 40px rgba(109, 108, 224, 0.25);
      }

      .drop-icon { width: 40px; height: 40px; color: var(--dim); transition: color 140ms ease, transform 140ms ease; }
      #drop:hover .drop-icon, #drop.over .drop-icon { color: var(--accent); transform: translateY(-2px); }
      .drop-title { font-size: 16px; font-weight: 600; margin-top: 12px; }
      .drop-sub { color: var(--dim); font-size: 13px; margin-top: 4px; }
      .browse { color: var(--accent); font-weight: 600; cursor: pointer; }
      .browse:hover { text-decoration: underline; }
      input[type="file"] { display: none; }

      .or-sep {
        display: flex; align-items: center; gap: 12px;
        color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
        margin: 0 0 20px;
      }
      .or-sep::before, .or-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }

      /* loading state (while the file is read + the reader boots) */
      .drop-loading { display: none; align-items: center; justify-content: center; gap: 10px; color: var(--dim); font-size: 14px; }
      #drop.loading .drop-inner { display: none; }
      #drop.loading { cursor: default; }
      #drop.loading .drop-loading { display: flex; }
      .spinner {
        width: 18px; height: 18px; border: 2px solid var(--border);
        border-top-color: var(--accent); border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #error { color: var(--danger); min-height: 18px; margin-top: 16px; font-size: 14px; }

      .library { margin: 28px 0 0; text-align: left; }
      .library-title {
        font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--dim); margin: 0 0 10px; padding-left: 2px;
      }
      .library-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .library-row {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        cursor: pointer;
        transition: border-color 140ms ease, background 140ms ease;
      }
      .library-row:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
      .library-row.is-local { cursor: default; }
      .library-row.is-local:hover { border-color: var(--border); }
      .library-icon { width: 18px; height: 18px; flex: none; color: var(--dim); }
      .library-main { flex: 1; min-width: 0; }
      .library-name {
        font-size: 14px; font-weight: 550; color: var(--fg);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .library-meta { font-size: 12px; color: var(--dim); margin-top: 2px; }
      .library-meta .resume { color: var(--amber); }
      .library-del {
        flex: none; width: 26px; height: 26px; padding: 0;
        border: none; border-radius: 8px; background: transparent;
        color: var(--dim); cursor: pointer; font-size: 16px; line-height: 1;
        opacity: 0; transition: opacity 120ms ease, background 120ms ease, color 120ms ease;
      }
      .library-row:hover .library-del { opacity: 1; }
      .library-del:hover { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }

      .drive-browse {
        display: inline-flex; align-items: center; gap: 8px;
        margin: 0 auto 20px; padding: 9px 16px;
        border: 1px solid var(--border); border-radius: 12px;
        background: var(--surface); color: var(--fg);
        font-size: 13px; font-weight: 550; cursor: pointer;
        transition: border-color 140ms ease, background 140ms ease;
      }
      .drive-browse:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
      .drive-browse svg { width: 16px; height: 16px; color: var(--accent); }

      .drive-browse.primed {
        padding: 11px 20px;
        font-size: 14px;
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 35%, transparent);
        animation: drive-pulse 1.4s ease-out 2;
      }
      .drive-browse.primed svg { color: #fff; }
      .drive-browse.primed:hover {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 88%, #000);
      }
      @keyframes drive-pulse {
        0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
        70% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 0%, transparent); }
        100% { box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 35%, transparent); }
      }
      @media (prefers-reduced-motion: reduce) {
        .drive-browse.primed { animation: none; }
      }
      .drive-hint {
        margin: -10px auto 20px;
        max-width: 340px;
        color: var(--dim);
        font-size: 12.5px;
        font-style: italic;
        line-height: 1.5;
      }
      .drive-hint::before { content: "*"; margin-right: 0.35em; font-style: normal; }
      .drive-hint strong { color: var(--fg); font-weight: 600; }

      .features { list-style: none; margin: 30px 0 0; padding: 0; display: inline-flex; flex-direction: column; gap: 9px; }
      .features li { display: flex; align-items: center; gap: 9px; color: var(--dim); font-size: 13px; }
      .features .feat { width: 15px; height: 15px; color: var(--accent); flex: none; }
      .features li:last-child .feat { color: var(--amber); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand">
        <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="tile" x1="24" y1="12" x2="104" y2="116" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#6d6ce0" />
              <stop offset="1" stop-color="#514fce" />
            </linearGradient>
          </defs>
          <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#tile)" />
          <rect x="32" y="41" width="64" height="9" rx="4.5" fill="#fff" fill-opacity="0.95" />
          <rect x="32" y="59" width="40" height="9" rx="4.5" fill="#fff" fill-opacity="0.92" />
          <rect x="32" y="77" width="56" height="9" rx="4.5" fill="#fff" fill-opacity="0.34" />
          <rect x="32" y="95" width="30" height="9" rx="4.5" fill="#fff" fill-opacity="0.2" />
          <rect x="78" y="54" width="10" height="19" rx="3" fill="#f5b544" />
        </svg>
        <span class="wordmark">Cadence<i class="caret"></i><span class="pending">Reading</span></span>
      </div>
      <p class="tagline">Read anything at your own pace, character by character.</p>

      <button type="button" id="drive-open" class="drive-browse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="drive-open-label">Open from Google Drive</span>
      </button>
      <p id="drive-hint" class="drive-hint" hidden></p>

      <div class="or-sep">or</div>

      <div id="drop">
        <div class="drop-inner">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6" />
            <path d="M12 18v-6" />
            <path d="m9 15 3-3 3 3" />
          </svg>
          <div class="drop-title">Drop a PDF here</div>
          <div class="drop-sub">or <label class="browse" for="file">browse your files</label></div>
        </div>
        <div class="drop-loading">
          <span class="spinner" aria-hidden="true"></span>
          <span id="loadingName">Opening…</span>
        </div>
        <input type="file" id="file" accept="application/pdf,.pdf" />
      </div>

      <div id="error" role="alert"></div>

      <section id="library" class="library" hidden>
        <h2 class="library-title">Recent</h2>
        <ul id="library-list" class="library-list"></ul>
      </section>

      <ul class="features">
        <li>
          <svg class="feat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
          Character-by-character reveal
        </li>
        <li>
          <svg class="feat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
          Notes &amp; highlights as you read
        </li>
        <li>
          <svg class="feat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
          On-device — no upload, no account
        </li>
      </ul>
    </main>

    <script type="module" src="reader.js"></script>
  </body>
</html>
